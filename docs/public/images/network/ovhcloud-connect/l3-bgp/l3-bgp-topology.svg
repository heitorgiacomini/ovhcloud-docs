<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 150" role="img" aria-label="OVHcloud Connect L3 BGP topology: your router peers with the OVHcloud PoP router over eBGP on a /30 subnet, the PoP router connects to the OVHcloud AZ routers A and B in your vRack via BGP, which reach your OVHcloud services.">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7a7a8c"/>
    </marker>
    <style>
      .box{fill:#eef1ff;stroke:#000e9c;stroke-width:1.5;}
      .t{font-family:Arial,Helvetica,sans-serif;font-size:12.5px;font-weight:600;fill:#0a1a2f;}
      .s{font-family:Arial,Helvetica,sans-serif;font-size:10px;fill:#5a6472;}
      .l{font-family:Arial,Helvetica,sans-serif;font-size:10.5px;fill:#333;}
      .ln{stroke:#7a7a8c;stroke-width:1.5;}
    </style>
  </defs>

  <rect class="box" x="10"  y="45" width="160" height="60" rx="8"/>
  <rect class="box" x="240" y="45" width="160" height="60" rx="8"/>
  <rect class="box" x="470" y="45" width="160" height="60" rx="8"/>
  <rect class="box" x="700" y="45" width="160" height="60" rx="8"/>

  <text class="t" x="90"  y="72" text-anchor="middle">Your router</text>
  <text class="s" x="90"  y="90" text-anchor="middle">your ASN</text>

  <text class="t" x="320" y="79" text-anchor="middle">OVHcloud PoP router</text>

  <text class="t" x="550" y="72" text-anchor="middle">OVHcloud AZ routers A / B</text>
  <text class="s" x="550" y="90" text-anchor="middle">in your vRack</text>

  <text class="t" x="780" y="72" text-anchor="middle">Your OVHcloud services</text>
  <text class="s" x="780" y="90" text-anchor="middle">172.16.x.x</text>

  <line class="ln" x1="170" y1="75" x2="237" y2="75" marker-end="url(#ah)"/>
  <line class="ln" x1="400" y1="75" x2="467" y2="75" marker-end="url(#ah)"/>
  <line class="ln" x1="630" y1="75" x2="697" y2="75" marker-end="url(#ah)"/>

  <text class="l" x="203" y="66" text-anchor="middle">eBGP · /30</text>
  <text class="l" x="433" y="66" text-anchor="middle">BGP peering</text>
  <text class="l" x="663" y="66" text-anchor="middle">vRack</text>
</svg>
